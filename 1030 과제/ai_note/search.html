<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용어 검색</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">🤖 AI 노트</a>
    <a href="search.html" class="active">🔍 용어 검색</a>
  </nav>

  <main class="container">
    <h1>위키백과 용어 검색</h1>

    <form id="search-form" class="card row">
      <input type="text" id="query" placeholder="검색어 (예: 인공지능)">
      <button type="submit" class="btn">검색</button>
    </form>

    <p id="search-message" class="message"></p>

    <!-- 검색 결과 목록 -->
    <section id="results"></section>

    <!-- 선택한 문서의 상세 내용 -->
    <section id="detail"></section>
  </main>

  <script src="js/search.js"></script>
</body>
</html>
