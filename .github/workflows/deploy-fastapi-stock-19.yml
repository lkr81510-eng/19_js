name: Deploy fastapi-stock-19

on:
  push:
    branches: [master]
    paths:
      - "fastapi-stock-19/**"
      - ".github/workflows/deploy-fastapi-stock-19.yml"
  workflow_dispatch:

concurrency:
  group: deploy-fastapi-stock-19
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload application
        run: |
          tar -C fastapi-stock-19 --exclude=.venv --exclude=__pycache__ -czf - . |
            ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
              set -e
              mkdir -p ~/fastapi-stock-19
              find ~/fastapi-stock-19 -mindepth 1 -maxdepth 1 ! -name .venv -exec rm -rf {} +
              tar -xzf - -C ~/fastapi-stock-19
            '

      - name: Install and restart service
        run: ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash ~/fastapi-stock-19/deploy/deploy.sh'
